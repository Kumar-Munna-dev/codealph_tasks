<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- Top AppBar - Following JSON structure -->
<header class="bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl text-primary dark:text-inverse-primary font-headline-md text-headline-md docked full-width top-0 sticky shadow-sm shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center px-container-margin h-16 w-full z-50">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined hover:opacity-80 transition-opacity active:scale-95 duration-200">arrow_back</button>
<span class="font-display-lg text-display-lg bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">LuxMarket</span>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined hover:opacity-80 transition-opacity active:scale-95 duration-200">help</span>
</div>
</header>
<main class="flex-1 w-full max-w-md px-container-margin flex flex-col items-center justify-center py-section-gap">
<!-- Hero Visual / Icon -->
<div class="mb-stack-lg relative">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="shield_lock" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<!-- Pulse effect for security vibe -->
<div class="absolute inset-0 w-24 h-24 rounded-full bg-primary/10 animate-ping opacity-25"></div>
</div>
<!-- Verification Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">Verify Your Identity</h1>
<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Enter the 6-digit code sent to your phone/email.
            </p>
</div>
<!-- OTP Input Grid -->
<div class="flex gap-stack-sm mb-stack-lg w-full justify-center">
<input autofocus="" class="w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all otp-input" maxlength="1" placeholder="•" type="text" value=""/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all otp-input" maxlength="1" placeholder="•" type="text" value=""/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all otp-input" maxlength="1" placeholder="•" type="text" value=""/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all otp-input" maxlength="1" placeholder="•" type="text" value=""/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all otp-input" maxlength="1" placeholder="•" type="text" value=""/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all otp-input" maxlength="1" placeholder="•" type="text" value=""/>
</div>
<!-- Primary Action -->
<div class="w-full mb-stack-md">
<button class="w-full h-[56px] rounded-xl bg-gradient-to-r from-primary to-secondary text-on-primary font-title-sm shadow-[0_10px_30px_rgba(37,99,235,0.2)] active:scale-95 transition-all duration-200">
                Verify
            </button>
</div>
<!-- Secondary Action / Timer -->
<div class="text-center">
<p class="font-body-sm text-on-surface-variant mb-stack-sm">Didn't receive the code?</p>
<button class="flex items-center justify-center gap-base font-label-caps text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]">history</span>
                Resend Code (0:59)
            </button>
</div>
<!-- Trust Badges Section -->
<div class="mt-section-gap w-full">
<div class="flex flex-col gap-stack-md p-stack-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/10">
<div class="flex items-center gap-stack-sm">
<div class="h-6 flex items-center gap-1 px-2 rounded-full bg-tertiary-container/10 text-tertiary text-[10px] font-bold uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                        Secure Encryption
                    </div>
</div>
<p class="font-body-sm text-on-surface-variant">
                    Your account security is our priority. We use industry-standard 256-bit encryption to protect your sensitive data during verification.
                </p>

</div>
</div>
